[project]
name = "snyk-repo-sync"
version = "0.1.0"
description = "Queue-driven worker for ADO and GitHub repository lifecycle sync with Snyk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.25.3",
    "azure-servicebus>=7.12.0",
    "azure-storage-queue>=12.18.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Service Bus configuration",
]

[tool.uv]
# Transitive-only security floors for the Azure dependency tree (Snyk Open
# Source scan, 2026-10-27). Not application dependencies: pyjwt, urllib3, and
# certifi are pulled in via azure-identity -> msal and azure-data-tables ->
# azure-core -> requests. Each floor keeps Python 3.12 support.
constraint-dependencies = [
    "pyjwt>=2.15.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
]
